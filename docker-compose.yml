services:
  postgres:
    image: postgres:18-alpine
    container_name: meaven-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meaven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - meaven_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meaven"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meaven_data: