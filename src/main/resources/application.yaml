server:
  servlet:
    context-path: /meaven

app:
  jwt:
    secret: ${JWT_SECRET:meaven_dev_secret_key_change_me_in_production_0123456789}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    cookie-secure: ${COOKIE_SECURE:false}

# API documentation (OpenApiConfig): Swagger UI at /meaven/swagger-ui.html
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # Each endpoint declares its own @ApiResponse; don't copy every GlobalExceptionHandler status into all of them
  override-with-generic-response: false

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/meaven}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  application:
    name: meaven
